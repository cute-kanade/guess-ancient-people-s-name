<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="__CSRF_TOKEN__">
  <title>猜历史人物 · Launcher v1</title>
  <style nonce="__CSP_NONCE__">
    :root { color-scheme: dark; font-family: system-ui,"Microsoft YaHei",sans-serif; background:#101217; color:#edf0f7 }
    * { box-sizing:border-box }
    body { max-width:960px; margin:0 auto; padding:40px 20px 80px }
    header { margin-bottom:30px }
    h1 { margin:0 0 8px; font-size:clamp(28px,6vw,48px) }
    .muted { color:#9da7ba }
    #packs { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px }
    .card,.panel { border:1px solid #30394b; border-radius:14px; padding:18px; background:#191e28 }
    .runtime-panel { margin-top:24px }
    .card h2 { margin:0 0 6px; font-size:20px }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px }
    button { border:0; border-radius:8px; padding:10px 15px; cursor:pointer; font-weight:700; background:#d9ad4a; color:#17130a }
    button.secondary { background:#30394b; color:#edf0f7 }
    button.danger { background:#793838; color:#fff }
    button:disabled { opacity:.45; cursor:not-allowed }
    dialog { color:#edf0f7; background:#191e28; border:1px solid #46516a; border-radius:14px; width:min(92vw,520px) }
    dialog::backdrop { background:rgba(0,0,0,.72) }
    label { display:block; margin:14px 0 5px }
    input,select { width:100%; padding:10px; border-radius:7px; border:1px solid #46516a; background:#101217; color:#edf0f7 }
    #notice { min-height:24px; margin:18px 0; color:#efca78 }
    code { color:#b9c9ec }
  </style>
</head>
<body>
  <header>
    <h1>猜历史人物</h1>
    <div class="muted">Launcher v1 · 本机回环服务 · 人物包由规范目录动态加载</div>
  </header>
  <p id="notice" role="status"></p>
  <main id="packs" aria-live="polite"></main>

  <dialog id="launch-dialog">
    <form method="dialog" id="launch-form">
      <h2 id="dialog-title">启动游戏</h2>
      <label for="provider">模型提供商</label>
      <select id="provider">
        <option value="zhipu">智谱 AI</option><option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option><option value="xai">xAI</option><option value="custom">自定义 HTTPS</option>
      </select>
      <label for="api-key">API Key（仅传给目标子进程）</label>
      <input id="api-key" type="password" required maxlength="512" autocomplete="off">
      <label for="base-url">HTTPS API 地址</label>
      <input id="base-url" type="url" required maxlength="2048">
      <label for="model">模型</label>
      <input id="model" required maxlength="128" pattern="[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}">
      <div class="row">
        <button value="cancel" class="secondary">取消</button>
        <button value="default" id="submit-launch">启动</button>
      </div>
    </form>
  </dialog>

  <section class="panel runtime-panel">
    <strong>运行状态</strong>
    <div id="runtime-status" class="muted">正在读取……</div>
  </section>

  <script nonce="__CSP_NONCE__">
    "use strict";
    const csrf = document.querySelector('meta[name="csrf-token"]').content;
    const notice = document.getElementById("notice");
    const dialog = document.getElementById("launch-dialog");
    let selectedPack = null;
    const profiles = {
      zhipu:["https://open.bigmodel.cn/api/paas/v4/chat/completions","glm-4.5-air"],
      deepseek:["https://api.deepseek.com/v1/chat/completions","deepseek-chat"],
      openai:["https://api.openai.com/v1/chat/completions","gpt-4o-mini"],
      xai:["https://api.x.ai/v1/chat/completions","grok-2"], custom:["",""]
    };
    function message(text) { notice.textContent = text; }
    function applyProfile() {
      const value = profiles[document.getElementById("provider").value];
      document.getElementById("base-url").value=value[0]; document.getElementById("model").value=value[1];
    }
    document.getElementById("provider").addEventListener("change", applyProfile);
    async function api(path, options={}) {
      const response = await fetch(path, options); let data=null;
      if (response.status !== 204) data=await response.json();
      return {response,data};
    }
    function openLaunch(pack) {
      selectedPack=pack; document.getElementById("dialog-title").textContent=`启动：${pack.display_name}`;
      document.getElementById("api-key").value=""; document.getElementById("provider").value="zhipu"; applyProfile(); dialog.showModal();
    }
    async function start(restart=false) {
      const payload={pack_id:selectedPack.id,profile:{provider_id:document.getElementById("provider").value,
        base_url:document.getElementById("base-url").value.trim(),model:document.getElementById("model").value.trim()},
        api_key:document.getElementById("api-key").value,restart};
      message("正在启动并验证游戏进程……");
      const {response,data}=await api("/api/v1/processes",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify(payload)});
      if (response.status===409 && !restart && confirm("该人物包正以另一配置运行。是否停止并重启？")) return start(true);
      if (!response.ok) { message(data?.error?.message || "启动失败。"); return; }
      dialog.close(); message(response.status===201 ? "游戏已启动。" : "正在复用相同配置的游戏。"); window.open(data.url,"_blank","noopener"); await refresh();
    }
    document.getElementById("launch-form").addEventListener("submit",event=>{ if (event.submitter?.value==="cancel") return; event.preventDefault(); start().catch(()=>message("本地启动请求失败。")); });
    async function stop(packId) {
      const {response,data}=await api(`/api/v1/processes/${encodeURIComponent(packId)}`,{method:"DELETE",headers:{"X-CSRF-Token":csrf}});
      message(response.ok ? "游戏进程已停止。" : (data?.error?.message || "停止失败。")); await refresh();
    }
    async function refresh() {
      const [{data:packs},{data:status}]=await Promise.all([api("/api/v1/packs"),api("/api/v1/status")]);
      const running=new Map(status.processes.map(item=>[item.pack_id,item])); const root=document.getElementById("packs"); root.replaceChildren();
      packs.items.forEach(pack=>{ const card=document.createElement("article"); card.className="card";
        const title=document.createElement("h2"); title.textContent=pack.display_name; const count=document.createElement("div"); count.className="muted"; count.textContent=`${pack.expected_count} 人`;
        const row=document.createElement("div"); row.className="row"; const launch=document.createElement("button"); launch.textContent=running.has(pack.id)?"打开/配置":"启动"; launch.disabled=!pack.available; launch.onclick=()=>openLaunch(pack); row.append(launch);
        if(running.has(pack.id)){const stopButton=document.createElement("button");stopButton.className="danger";stopButton.textContent="停止";stopButton.onclick=()=>stop(pack.id);row.append(stopButton)}
        card.append(title,count,row); root.append(card); });
      document.getElementById("runtime-status").textContent=status.processes.length ? status.processes.map(p=>`${p.pack_id}: ${p.state} @ ${p.port}`).join(" · ") : "没有运行中的游戏";
    }
    refresh().catch(()=>message("无法读取本地 Launcher 状态。")); setInterval(()=>refresh().catch(()=>{}),5000);
  </script>
</body>
</html>
